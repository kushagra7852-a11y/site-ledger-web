<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Ledger</title>
<meta name="theme-color" content="#2A43C2"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Site Ledger">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<script src="lib/firebase-app-compat.js"></script><script src="lib/firebase-auth-compat.js"></script><script src="lib/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="bridge.js"></script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85,600;85,700;100,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cash-book app — sticky project bar + tab strip, one working view at a time, ledger tables ruled with a red margin line */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#EBEEF3; --ink:#142033; --ink-2:#4B576A; --ink-3:#7A8597;
  --line:#DBE0E8; --carbon:#2A43C2; --carbon-ink:#FFFFFF; --carbon-soft:#E5E9FA; --margin:#C2413A; --margin-soft:#FBE9E7;
  --ok:#1E7A4C; --ok-soft:#E2F3EA; --warn:#9A6200; --warn-soft:#FBF0DA;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131B; --surface:#151C27; --sunk:#1B2431; --ink:#E5EAF2; --ink-2:#A2ADBD; --ink-3:#768296;
  --line:#2A3445; --carbon:#8EA0FF; --carbon-ink:#0E131B; --carbon-soft:#1D2850; --margin:#F07A70; --margin-soft:#3A1F22;
  --ok:#5DC58F; --ok-soft:#163327; --warn:#E3B14C; --warn-soft:#3A2D12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131B; --surface:#151C27; --sunk:#1B2431; --ink:#E5EAF2; --ink-2:#A2ADBD; --ink-3:#768296;
  --line:#2A3445; --carbon:#8EA0FF; --carbon-ink:#0E131B; --carbon-soft:#1D2850; --margin:#F07A70; --margin-soft:#3A1F22;
  --ok:#5DC58F; --ok-soft:#163327; --warn:#E3B14C; --warn-soft:#3A2D12; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
a{color:var(--carbon)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;white-space:nowrap}
.brand i{display:inline-block;width:14px;height:18px;border-left:3px solid var(--margin);border-right:1px solid var(--carbon);background:repeating-linear-gradient(var(--carbon-soft) 0 3px,transparent 3px 6px)}
.proj{display:flex;gap:8px;align-items:center;flex:1 1 260px;min-width:0}
.proj select{flex:1;min-width:0;max-width:420px}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
@media (max-width:560px){.sync{display:none}}
.mods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px}.mods::-webkit-scrollbar{display:none}.mods a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface)}.mods a[aria-current="page"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
mark{background:#FFE58A;color:#111;border-radius:2px;padding:0 1px}
@media (max-width:560px){#hdrSearch{flex-basis:100%}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--carbon)}
.tabs a .cnt{font-family:var(--f-mono);font-size:11px;background:var(--margin-soft);color:var(--margin);border-radius:9px;padding:0 6px;margin-left:5px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--carbon);border-color:var(--carbon);color:var(--carbon-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--margin);border-color:var(--margin)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--carbon);outline:none;box-shadow:0 0 0 3px var(--carbon-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink);width:100%}

main{padding-block:20px 60px}
.view{display:flex;flex-direction:column;gap:18px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPI strip: one ruled card, cells divided */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.kpi{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.neg .v{color:var(--margin)} .kpi.pos .v{color:var(--ok)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}.kpi:nth-child(odd){border-left:0!important}.kpi:nth-child(-n+2){border-top:0}}

.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sp{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:6px;padding:10px 12px;cursor:pointer;min-width:0}
.sp:hover{border-color:var(--carbon)}
.sp .v{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.sp .s{font-size:11px;color:var(--ink-3)}
.sp .mini{height:4px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.sp .mini span{position:absolute;inset:0 auto 0 0;background:var(--carbon)}
.projmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.projmeta b{color:var(--ink);font-weight:600}

/* contract track */
.track{position:relative;height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.track .b{position:absolute;top:0;bottom:0;left:0;background:var(--carbon);opacity:.85}
.track .s{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(135deg,var(--margin) 0 4px,transparent 4px 7px);opacity:.75}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* category bars */
.cats{display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 104px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.cat:first-child{border-top:0}
.cat:hover .nm{color:var(--carbon)}
.cat .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .bar{height:8px;background:var(--sunk);border-radius:2px;position:relative}
.cat .bar span{position:absolute;inset:0 auto 0 0;background:var(--carbon);border-radius:2px}
.cat .bar span.over{background:var(--margin)}
.cat .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.cat .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13px;white-space:nowrap}
.cat .amt small{display:block;color:var(--ink-3);font-size:11px}

/* ledger table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.led{border-collapse:collapse;width:100%;font-size:13px}
table.led th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
table.led td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.led tr:last-child td{border-bottom:0}
table.led td:first-child,table.led th:first-child{border-right:2px solid var(--margin);padding-left:12px}
table.led td.n,table.led th.n{text-align:right;white-space:nowrap}
table.led tbody tr{cursor:pointer}
table.led tbody tr:hover td{background:var(--carbon-soft)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.ph{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--line)}.ph input,.ph select{font-size:12px;padding:4px 6px;min-width:0;width:100%}.ph label input{width:auto}.ph>div{flex-wrap:wrap}.ph select[data-ph$=":kind"]{width:auto;flex:1 1 90px}
.sgrid{display:grid;grid-template-columns:var(--cols) auto;gap:6px;align-items:center}.sgrid input,.sgrid select{width:100%;font-size:13px;padding:6px 7px;min-width:0}
.gc{display:flex;flex-direction:column;gap:2px;min-width:0}.gc .ml{display:none;font-size:11px;color:var(--ink-3);font-weight:600}
.sdnav{position:sticky;top:var(--toph,0px);z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 0 10px;background:var(--paper);scrollbar-width:none}
.sdnav .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:34px}
.sdnav .chip.on{border-color:var(--ok,#2e7d32);color:var(--ok,#2e7d32)}.sdnav .chip b{font-weight:700}
.sdbar{position:sticky;bottom:0;z-index:7;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.mc-h{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}.mc-h b{flex:1}
.mc-g{padding:0;grid-template-columns:repeat(4,minmax(0,1fr))}.mc-g .f input,.mc-g .f select{width:100%;min-width:0}
[id^="sd"].panel{scroll-margin-top:calc(var(--toph,0px) + 56px)}
@media (max-width:760px){.top{position:static}}
.dq{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0 10px}.dq b{font-weight:600;min-width:250px}.dq label{display:flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}.dq label:has(input:checked){border-color:var(--carbon);background:var(--carbon);color:var(--carbon-ink)}.dq input[type=radio]{margin:0}.sd0.need{outline:2px solid var(--margin);outline-offset:2px}
@media (max-width:560px){.kpis.sdk .kpi:nth-child(n+3){display:none}}
@media (max-width:760px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sgrid .rowh{display:none}.gc .ml{display:block}.sgrid>button{grid-column:1/-1;justify-self:end;margin-bottom:8px}.mc-g{grid-template-columns:repeat(2,minmax(0,1fr))}.sgrid input,.sgrid select,.mc-g input,.mc-g select{font-size:16px;padding:9px 8px}}.rowh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.mflag{font-size:12px;padding:4px 8px;border-radius:5px;margin-top:3px;background:var(--sunk);color:var(--ink-2)}.mflag.bad{background:var(--margin-soft);color:var(--margin)}.mflag.pend{background:var(--warn-soft);color:var(--warn)}.mflag.ver{background:var(--ok-soft);color:var(--ok)}.mflag.rej,.mflag.inad{background:var(--sunk);color:var(--ink-3)}.mrw{padding-bottom:6px;border-bottom:1px dashed var(--line)}
.docprev{overflow:auto;background:#7b8390;padding:10px;border-radius:8px;max-height:82vh}.docscale{zoom:.6}
.kvt{border-collapse:collapse;width:100%;font-size:13px}.kvt td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}.kvt td:first-child{color:var(--ink-2);width:46%;padding-right:10px}.kvt tr:first-child td{border-top:0}
table.led tr.sub td{background:var(--sunk);cursor:default}
table.led tfoot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line)}
td.desc{min-width:180px;max-width:320px}
td.nowrap{white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--margin-soft);color:var(--margin)}
.pill.info{background:var(--carbon-soft);color:var(--carbon)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 200px}
.toolbar select{flex:0 1 auto;max-width:190px}
.sumline{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.sumline b{font-family:var(--f-mono);color:var(--ink);font-weight:500}

.quick{display:flex;gap:8px;align-items:stretch;background:var(--carbon-soft);border-radius:8px;padding:10px;flex-wrap:wrap}
.quick input{flex:1 1 260px;border-color:transparent}
.quick .tag{font-size:12px;font-weight:600;color:var(--carbon);align-self:center;padding:0 4px}

/* chart */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--carbon)}
svg.chart .bar.last{fill:var(--margin)}
svg.chart .val{fill:var(--ink-2)}

/* checks */
.chk{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .sev{align-self:stretch;border-radius:2px}
.chk .sev.high{background:var(--margin)} .chk .sev.med{background:var(--warn)} .chk .sev.low{background:var(--ink-3)}
.chk .t{font-weight:600}
.chk .d{font-size:13px;color:var(--ink-2)}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}

/* assistant */
.chat{display:flex;flex-direction:column;gap:14px;min-height:240px}
.msg{max-width:780px;min-width:0}
.msg.u{align-self:flex-end;background:var(--carbon);color:var(--carbon-ink);padding:9px 13px;border-radius:12px 12px 2px 12px}
.msg.a{background:var(--surface);border:1px solid var(--line);padding:12px 15px;border-radius:12px 12px 12px 2px}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:20px}
.msg.a.thinking{color:var(--ink-3);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px;text-align:left}
.chip:hover{border-color:var(--carbon);color:var(--carbon)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:160px}
.draft{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--carbon);border-radius:8px;background:var(--carbon-soft)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.db .s2{grid-column:span 2} .db .s4{grid-column:1/-1}
@media (max-width:560px){.db{grid-template-columns:repeat(2,minmax(0,1fr))}.db .s2{grid-column:1/-1}}
.df{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .r{display:flex;gap:8px;margin-left:auto}
.calc{grid-column:1/-1;font-size:12px;color:var(--ink-2);background:var(--sunk);padding:7px 10px;border-radius:var(--r)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--margin);font-weight:500}

.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:520px;margin:0;color:var(--ink-2)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
.recent{display:flex;flex-direction:column}
.recent .r{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.recent .r:first-child{border-top:0}
.recent .r .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.msg,.chk{animation:in .18s ease-out}@keyframes in{from{transform:translateY(3px)}to{transform:none}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Site Ledger</div>
    <div class="proj">
      <label for="projSel" class="lbl" style="white-space:nowrap">Project</label>
      <select id="projSel" aria-label="Choose project"></select>
      <button class="btn sm" id="projEdit" type="button" title="Project settings, contract value and budgets">Settings</button>
      <button class="btn sm" id="projNew" type="button">+ New</button>
    </div>

const TABS = [["overview","Overview"],["funds","Investors & funds"],["progress","Progress"],["site","Daily site"],["boq","BOQ"],["rabill","RA / Final bill"],["letters","Letters & EOT"],["materials","Materials"],["cost","Cost analysis"],["expenses","Expenses"],["labour","Labour"],["bills","Receipts"],["payees","Payees"],["checks","Checks"],["assistant","Assistant"],["library","DAR library"],["refs","References"],["portfolio","All projects"],["guide","Guide & training"],["compliance","Compliance"],["workfile","Work file"],["makes","Approved makes"],["tests","Tests & registers"],["specs","Specs & QC"],["search","Search"]];

/* ---------- state ---------- */
const S = { db:null, user:null, sample:null, downloads:null, canWrite:true, tools:false,
  projects:[], pid:null, expenses:[], bills:[], loadedProjects:false, loadedExp:false, offline:false,
  f:{q:"",cat:"",payee:"",month:"",status:"",inv:""}, sort:{k:"date",d:-1},
  chat:[], drafts:[], busy:false, ctl:null, importRows:null, port:{data:null,loading:false,at:0}, boq:[], lib:[], boqImport:null, matOpen:null, matOnlyBuy:false, libQ:"", imgOk:false, fileMode:"exp", rb:{sel:null,sub:"meas"}, meas:{}, progress:[], workers:[], att:[], labMonth:"", libBase:[] };
let unsubFd=null, unsubExp=null, unsubBills=null, unsubBoq=null, unsubProg=null, unsubWk=null, unsubAtt=null, unsubLt=null, unsubTs=null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (typeof v === "number") return isFinite(v)?v:0; const n = parseFloat(String(v ?? "").replace(/[₹,\s]/g,"")); return isFinite(n)?n:0; };
const nf2 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2});
const inr = v => (v<0?"−":"") + "₹" + nf2.format(Math.abs(Math.round(num(v)*100)/100));
const inr0 = v => (v<0?"−":"") + "₹" + new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(Math.abs(Math.round(num(v))));
const lakh = v => { const a=Math.abs(v), s=v<0?"−":""; if (a>=1e7) return s+"₹"+(a/1e7).toFixed(2)+" Cr"; if (a>=1e5) return s+"₹"+(a/1e5).toFixed(2)+" L"; return inr0(v); };
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtD = iso => { if(!iso) return "—"; const [y,m,d]=String(iso).split("-"); return d&&m&&y?`${d}.${m}.${y}`:esc(iso); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monLabel = ym => { const [y,m]=ym.split("-"); return `${MON[+m-1]} ${y.slice(2)}`; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
function parseDate(v){
  if (v==null||v==="") return "";
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if (typeof v==="number" && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return "";
}
function normCat(c, cs){
  const raw=String(c||"").trim(); cs=cs||[]; if(!raw) return cs.find(x=>x==="Misc")||"Misc";
  const L=raw.toLowerCase(), find=t=>cs.find(x=>x.toLowerCase()===t.toLowerCase());
  const hit=find(raw); if(hit) return hit;
  const a=CAT_ALIAS[L]; if(a&&find(a)) return find(a);
  const part=cs.find(x=>x.toLowerCase().split(/[\s\/&(),.-]+/).includes(L))||cs.find(x=>x.toLowerCase().startsWith(L)); if(part) return part;
  if(a) return a;
  return raw.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase());
}
const calcAmt = e => (num(e.qty)>0 ? num(e.qty)*num(e.rate) : num(e.rate)) + num(e.gst) + num(e.transport);
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const store = { get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };
const proj = () => S.projects.find(p=>p.id===S.pid) || null;
function headsOf(p, E){
  let H = p&&Array.isArray(p.heads)&&p.heads.length ? p.heads.map(h=>({name:String(h.name),group:GROUPS.includes(h.group)?h.group:"Other"}))
    : p&&Array.isArray(p.categories)&&p.categories.length ? p.categories.map(n=>({name:n,group:HEAD_GROUP[String(n).toLowerCase()]||"Other"})) : headsFromTemplate("civil");
  const have=new Set(H.map(h=>h.name)); (E||[]).forEach(e=>{ if(e.category&&!have.has(e.category)){ have.add(e.category); H.push({name:e.category,group:HEAD_GROUP[e.category.toLowerCase()]||"Other"}); } });
  return H;
}
const heads = () => headsOf(proj(), S.expenses);
const cats = () => heads().map(h=>h.name);
const groupMap = (p,E) => Object.fromEntries(headsOf(p,E).map(h=>[h.name,h.group]));
const groupOf = c => groupMap(proj(),S.expenses)[c] || HEAD_GROUP[String(c||"").toLowerCase()] || "Other";

/* ---------- compute ---------- */
function compute(p=proj()||{}, E=S.expenses, B=S.bills){
  let total=0,credit=0,gst=0; const byCat={}, byMonth={}, payees={}, byGroup={}, gm=groupMap(p,E); let last="";
  E.forEach(e=>{
    const a=num(e.amount); total+=a; gst+=num(e.gst); if(e.status==="On credit") credit+=a;
    const c=e.category||"Misc"; (byCat[c]||(byCat[c]={amt:0,n:0})).amt+=a; byCat[c].n++; const gr=gm[c]||"Other"; byGroup[gr]=(byGroup[gr]||0)+a; if((e.date||"")>last) last=e.date;
    const ym=(e.date||"").slice(0,7); if(ym) byMonth[ym]=(byMonth[ym]||0)+a;
    const py=(e.payee||"").trim()||"(no payee)"; const P=payees[py]||(payees[py]={name:py,amt:0,n:0,credit:0,last:"",cats:new Set()});
    P.amt+=a; P.n++; if(e.status==="On credit") P.credit+=a; if((e.date||"")>P.last) P.last=e.date; P.cats.add(c);
  });
  const budgets=p.budgets||{};
  const catRows=Object.keys({...byCat,...Object.fromEntries(Object.entries(budgets).filter(([,v])=>num(v)>0))}).map(c=>({cat:c,amt:byCat[c]?.amt||0,n:byCat[c]?.n||0,budget:num(budgets[c])})).sort((a,b)=>b.amt-a.amt||b.budget-a.budget);
  let billed=0,billedGst=0,received=0,ded=0,sd=0,receivable=0;
  B.forEach(b=>{ if(b.status==="Draft") return; const g=num(b.gross); billed+=g; billedGst+=num(b.gstAmount);
    const rec=num(b.netReceived), d=num(b.itTds)+num(b.gstTds)+num(b.other), s=num(b.sd);
    received+=rec; ded+=d; sd+=s; receivable+=Math.max(0,g-rec-d-s); });
  const cv=num(p.contractValue);
  const groupRows=GROUPS.map(g=>({group:g,amt:byGroup[g]||0,budget:catRows.filter(r=>(gm[r.cat]||"Other")===g).reduce((s,r)=>s+r.budget,0)})).filter(g=>g.amt>0||g.budget>0);
  const FS=fundSum(), CL=p.closure||{}, sdRef=num(CL.sdRefAmt);
  return {total,paid:total-credit,credit,gst,catRows,groupRows,last,byMonth,payees:Object.values(payees).sort((a,b)=>b.amt-a.amt),billed,billedGst,received,ded,sd,sdRef,sdHeld:Math.max(0,sd-sdRef),receivable,cash:FS.net+received+sdRef-(total-credit),fundsIn:FS.in,fundsOut:FS.out,fundsNet:FS.net,cv};
}
function checks(){
  const out=[], E=S.expenses.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const p=proj()||{}, C=compute();
  // budgets
  C.catRows.forEach(r=>{ if(r.budget>0 && r.amt>r.budget) out.push({sev:"high",type:"Over budget",title:`${r.cat} is over budget by ${inr0(r.amt-r.budget)}`,detail:`Spent ${inr0(r.amt)} against a budget of ${inr0(r.budget)} (${Math.round(r.amt/r.budget*100)}%).`,cat:r.cat});
    else if(r.budget>0 && r.amt>0.9*r.budget) out.push({sev:"med",type:"Near budget",title:`${r.cat} has used ${Math.round(r.amt/r.budget*100)}% of its budget`,detail:`${inr0(r.budget-r.amt)} left of ${inr0(r.budget)}.`,cat:r.cat}); });
  if (C.cv>0 && C.total>C.cv) out.push({sev:"high",type:"Over budget",title:`Total expense exceeds the contract value`,detail:`Spent ${lakh(C.total)} against a contract value of ${lakh(C.cv)}.`});
  // duplicates
  for(let i=0;i<E.length;i++) for(let j=i+1;j<E.length;j++){
    const a=E[i], b=E[j]; if(num(a.amount)!==num(b.amount) || num(a.amount)<=0) continue;
    if((a.payee||"").toLowerCase()!==(b.payee||"").toLowerCase()) continue;
    const gap=Math.abs(daysBetween(a.date,b.date));
    const sameDesc=(a.desc||"").toLowerCase()===(b.desc||"").toLowerCase();
    if((sameDesc && gap<=3) || (num(a.amount)>=50000 && num(a.qty)>0 && num(a.qty)===num(b.qty) && (a.desc||"").toLowerCase()===(b.desc||"").toLowerCase() && gap<=90))
      out.push({sev:"high",type:"Possible duplicate",title:`${inr(a.amount)} paid twice to ${a.payee||"same payee"}`,detail:`${fmtD(a.date)} “${a.desc}” and ${fmtD(b.date)} “${b.desc}”. Confirm both are separate purchases.`,ids:[a.id,b.id]});
  }
  // invoices
  E.forEach(e=>{ if(e.invoice==="Pending") out.push({sev:"med",type:"Invoice pending",title:`Invoice pending — ${e.desc||e.category}`,detail:`${fmtD(e.date)} · ${e.payee||"—"} · ${inr(e.amount)}`,ids:[e.id]});
    else if(e.invoice!=="Attached" && !e.invoiceUrl) out.push({sev:"med",type:"No invoice",title:`No invoice or proof — ${e.desc||e.category}`,detail:`${fmtD(e.date)} · ${e.payee||"no payee"} · ${inr(e.amount)}`,ids:[e.id]}); });
  // txn id: online payments with no reference on any entry of the same date+payee
  const covered=new Set(E.filter(e=>e.txnId&&e.txnId!=="-").map(e=>e.date+"|"+(e.payee||"").toLowerCase()));
  const noTxn={}; E.forEach(e=>{ if(["GPay/UPI","Online","Bank transfer"].includes(e.mode) && !covered.has(e.date+"|"+(e.payee||"").toLowerCase())){ const k=e.date+"|"+e.payee; (noTxn[k]||(noTxn[k]=[])).push(e);} });
  Object.values(noTxn).forEach(g=>out.push({sev:"med",type:"No transaction ID",title:`No transaction reference — ${g[0].payee||"no payee"}, ${fmtD(g[0].date)}`,detail:`${g.length} online entr${g.length>1?"ies":"y"} totalling ${inr(g.reduce((s,e)=>s+num(e.amount),0))} with no UTR / transaction ID.`,ids:g.map(e=>e.id)}));
  E.forEach(e=>{ if(!(e.payee||"").trim()) out.push({sev:"low",type:"Missing payee",title:`No payee recorded — ${e.desc||e.category}`,detail:`${fmtD(e.date)} · ${inr(e.amount)}`,ids:[e.id]}); });
  // arithmetic
  E.forEach(e=>{ if(num(e.rate)>0 && Math.abs(calcAmt(e)-num(e.amount))>1) out.push({sev:"low",type:"Qty × Rate mismatch",title:`${e.desc||e.category}: entries don't add up`,detail:`${num(e.qty)>0?`${nf2.format(num(e.qty))} × ${inr(e.rate)}`:`Rate ${inr(e.rate)}`}${num(e.gst)?` + GST ${inr(e.gst)}`:""}${num(e.transport)?` + transport ${inr(e.transport)}`:""} = ${inr(calcAmt(e))}, but amount is ${inr(e.amount)} (${fmtD(e.date)}).`,ids:[e.id]}); });
  E.forEach(e=>{ if(e.status==="On credit") out.push({sev:"med",type:"Payable",title:`Unpaid credit purchase — ${e.payee||e.desc}`,detail:`${fmtD(e.date)} · ${e.desc} · ${inr(e.amount)} still to pay.`,ids:[e.id]}); });
  S.bills.forEach(b=>{ if(["Submitted","Passed"].includes(b.status)){ const age=daysBetween(b.billDate,todayISO()); if(age>30) out.push({sev:age>60?"high":"med",type:"Bill payment due",title:`${b.billNo||"Bill"} unpaid for ${age} days`,detail:`${inr(b.gross)} submitted ${fmtD(b.billDate)}, status “${b.status}”.`,bill:b.id}); } });
  if(p.dueDate && todayISO()>p.dueDate && C.cv>0 && C.billed<C.cv) out.push({sev:"high",type:"Timeline",title:`Completion date ${fmtD(p.dueDate)} has passed`,detail:`Billed ${lakh(C.billed)} of ${lakh(C.cv)}. Consider applying for extension of time.`});
  if(S.boq.length){ const st=statement();
    if(st.missing.length) out.push({sev:"med",type:"Material statement",title:`${st.missing.length} BOQ item${st.missing.length>1?"s have":" has"} no DAR 2023 analysis`,detail:`Not counted in the material statement: ${st.missing.slice(0,6).map(b=>b.dsrNo||b.sno).join(", ")}${st.missing.length>6?"…":""}.`,go:"materials"});
    st.rows.forEach(r=>{ if(r.reqP>0&&r.bought>r.reqP*1.1) out.push({sev:"med",type:"Material statement",title:`${r.name}: bought ${((r.bought/r.reqP-1)*100).toFixed(0)}% more than required`,detail:`Required ${q3(r.reqP)} ${r.pu}, purchased ${q3(r.bought)} ${r.pu}. Check for wastage, theft or a wrong quantity.`,go:"materials"}); });
    const unv=st.rows.filter(r=>r.unverified).length; if(unv) out.push({sev:"low",type:"Material statement",title:`${unv} material${unv>1?"s use":" uses"} DAR analyses not yet checked`,detail:"Open those analyses in the DAR library, compare with the book and save them.",go:"library"}); }
  if((S.progress||[]).length){ const K=costing(); if(K.open) out.push({sev:"low",type:"Site register",title:`${K.open} day${K.open>1?"s have":" has"} work recorded but not finalised`,detail:"Check the day's measurement at the end of the day and finalise it in Daily site.",go:"site"});
    if(K.T.unb>1){ const R=runAcct(); out.push({sev:R.due?"med":"low",type:"Site register",title:`${inr0(K.T.unb)} of executed work not yet billed`,detail:R.due?`RA bill due as per NIT — ${R.why.join("; ")}. New RA bill copies the daily MB date-wise.`:"Raise the next RA bill; the daily MB is copied date-wise into its measurement.",go:"rabill"}); }
    sitePay().filter(x=>x.bal>1).slice(0,6).forEach(x=>out.push({sev:"med",type:"Labour payable",title:`${x.name}: ${inr0(x.bal)} due as per site register`,detail:`Earned ${inr0(x.amt)} up to ${fmtD(x.last)}; paid ${inr0(x.paid)} in the cash book.`,go:"cost"})); }
  lookAhead().filter(x=>x.slip!=null&&x.slip<-10).forEach(x=>out.push({sev:x.left!=null&&x.left<=0?"high":"med",type:"Behind programme",title:`${x.b.sno||x.b.dsrNo||""} ${String(x.b.desc).slice(0,50)} — ${Math.abs(x.slip).toFixed(0)}% behind plan`,detail:`Planned ${q3(x.pq)} ${x.b.unit} by today, done ${q3(x.e)}.${x.need!=null?` Needs ${q3(x.need)} ${x.b.unit}/day to finish by ${fmtD(x.b.planEnd)}.`:" Planned finish has passed."}`,go:"site"}));

function barChart(data){
  const W=560,H=190,pl=46,pr=8,pt=18,pb=26, max=Math.max(...data.map(d=>d.v))||1;
  const step=niceStep(max/4), top=Math.ceil(max/step)*step, ih=H-pt-pb, iw=W-pl-pr, bw=Math.min(46, iw/data.length*0.62);
  let g=""; for(let t=0;t<=top+1e-6;t+=step){ const y=pt+ih-(t/top)*ih; g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${t>=1e5?(t/1e5).toFixed(t%1e5?1:0)+"L":t>=1e3?(t/1e3)+"k":t}</text>`; }
  const bars=data.map((d,i)=>{ const cx=pl+iw*(i+.5)/data.length, h=d.v/top*ih, y=pt+ih-h; return `<rect class="bar${i===data.length-1?" last":""}" x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="2"><title>${d.l}: ${inr0(d.v)}</title></rect><text class="val" x="${cx}" y="${y-5}" text-anchor="middle">${d.v>=1e5?(d.v/1e5).toFixed(1)+"L":Math.round(d.v/1e3)+"k"}</text><text x="${cx}" y="${H-8}" text-anchor="middle">${d.l}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spend">${g}${bars}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))), n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function chkRow(c){ const act = c.ids?.length===1?`<button class="btn sm" type="button" data-edit="${esc(c.ids[0])}">Open</button>`: c.ids?.length?`<button class="btn sm" type="button" data-ids="${esc(c.ids.join(","))}">Show</button>`: c.cat?`<button class="btn sm" type="button" data-cat="${esc(c.cat)}">Show</button>`: c.bill?`<button class="btn sm" type="button" data-editbill="${esc(c.bill)}">Open</button>`: c.go?`<button class="btn sm" type="button" data-go="${esc(c.go)}">Open</button>`:"";
  return `<div class="chk"><span class="sev ${c.sev}"></span><div><div class="t">${esc(c.title)}</div><div class="d">${esc(c.detail)}</div></div><div>${act}</div></div>`; }

/* ---------- BOQ, DAR library & material statement ---------- */
const nf3 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:3});
const q3 = v => nf3.format(Math.round(num(v)*1000)/1000);
const normNo = x => String(x??"").trim().toLowerCase().replace(/\s+/g,"").replace(/^(dsr|item|no\.?)[:\-]?/,"").replace(/\.+$/,"");
const libId = n => "i_"+(normNo(n).replace(/[^a-z0-9_.~:@+-]/g,"_").slice(0,150)||"x");

const canonKey = k => String(k||"").replace(/-\d+(?:-\d+)?-cum(?=__)/,"");
const canonMatName = n => String(n||"").replace(/^(portland(?: pozzolana| slag)? cement)\s*\(\s*\d+(?:\.\d+)?\s*cum\s*\)\s*$/i,"$1");
const matKey = m => canonKey(String(m.name||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")+"__"+String(m.unit||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""));
const natCmp = (a,b) => { const A=String(a||"").split(/[.\-\s]/), B=String(b||"").split(/[.\-\s]/); for(let i=0;i<Math.max(A.length,B.length);i++){ const x=A[i]??"", y=B[i]??""; const nx=parseFloat(x), ny=parseFloat(y); if(!isNaN(nx)&&!isNaN(ny)&&nx!==ny) return nx-ny; if(x!==y) return x.localeCompare(y); } return 0; };
const bySeq = (a,b) => (num(a.seq)-num(b.seq)) || natCmp(a.dsrNo,b.dsrNo);
let libCache=null;
function unitFactor(bu,lu){ const n=u=>{ u=String(u||"").toLowerCase().replace(/[.\s]/g,""); if(/^(kg|kgs|kilogram)/.test(u)) return ["w",1]; if(/^(q|qtl|quintal)/.test(u)) return ["w",100]; if(/^(t|mt|tonne|ton)/.test(u)) return ["w",1000]; if(/^(m|rm|rmt|metre|meter|running)/.test(u)) return ["l",1]; if(/^(sqm|m2|sq)/.test(u)) return ["a",1]; if(/^(cum|m3|cu)/.test(u)) return ["v",1]; if(/^(each|no|nos|number)/.test(u)) return ["n",1]; return [u,1]; };
  const [a,fa]=n(bu),[b,fb]=n(lu); return a===b?fa/fb:1; }
/* DAR gives steel reinforcement (item unit kg) per quintal — 1.05 quintal of bars per quintal of work */
const libFix = i => /^kg/i.test(String(i.unit||"").trim())&&(i.materials||[]).some(m=>/quintal/i.test(m.unit||"")&&num(m.qty)>=1&&num(m.qty)<=1.2)?{...i,unit:"quintal"}:i;

function libIndex(){ const L={}; libAll().forEach(i=>{ L[normNo(i.dsrNo)]=i; }); return L; }
function expandMats(li, L, depth=0, seen=new Set()){
  const out=[]; seen=new Set(seen); seen.add(normNo(li.dsrNo));
  (li.materials||[]).forEach(m=>{ const sub=m.ref?L[normNo(m.ref)]:null;
    if(sub && depth<4 && !seen.has(normNo(sub.dsrNo))) expandMats(sub,L,depth+1,seen).forEach(x=>out.push({...x,qty:num(x.qty)*num(m.qty),unverified:x.unverified||sub.verified===false}));
    else out.push({name:canonMatName(String(m.name||"").trim()),unit:String(m.unit||"").trim(),qty:num(m.qty),code:m.code||"",unverified:false}); });
  return out;
}
function convOf(p,R){
  const MC=p.matConv||{}, c=MC[R.key]||MC[Object.keys(MC).find(k=>canonKey(k)===R.key)]; if(c&&c.pu&&num(c.f)>0) return {pu:String(c.pu),f:num(c.f),set:true};

function expandLab(li,L,depth=0,seen=new Set()){
  const out=[]; seen=new Set(seen); seen.add(normNo(li.dsrNo));
  (li.labour||[]).forEach(m=>out.push({kind:"Labour",name:String(m.name||"").trim(),unit:m.unit||"day",qty:num(m.qty),code:m.code||""}));
  (li.machinery||[]).forEach(m=>out.push({kind:"Machinery / transport",name:String(m.name||"").trim(),unit:m.unit||"day",qty:num(m.qty),code:m.code||""}));
  (li.materials||[]).forEach(m=>{ const sub=m.ref?L[normNo(m.ref)]:null; if(sub&&depth<4&&!seen.has(normNo(sub.dsrNo))) expandLab(sub,L,depth+1,seen).forEach(x=>out.push({...x,qty:x.qty*num(m.qty)})); });
  return out;
}
function labStatement(B=S.boq){
  const L=libIndex(), rows={}, EX=execMap().m;
  B.forEach(b=>{ const li=L[normNo(b.dsrNo)]; if(!li) return; const uf=unitFactor(b.unit,li.unit);
    expandLab(li,L).forEach(m=>{ const k=m.kind+"|"+m.name.toLowerCase()+"|"+String(m.unit).toLowerCase(); const R=rows[k]||(rows[k]={kind:m.kind,name:m.name,unit:m.unit,code:m.code,req:0,exec:0,n:0});
      const c=m.qty*uf; R.req+=c*num(b.qty); R.exec+=c*num(EX[b.id]); R.n++; }); });

 {id:"about",t:"1. What this app does",lead:"One app for a contractor's work at site: finance (cash book, profit), site (daily register, labour, materials), bills (RA / Final with all CWC documents) and contract letters (hindrance, EOT, deviation, extra items). Everything is entered once and used everywhere.",
  steps:["The app has 3 modules (pills at the top): 1 · Site finance (dashboard, cash book, receipts, payees, cost analysis, materials, checks); 2 · Site work & compliance (daily site register with photos, progress, BOQ, labour, NIT / GCC compliance, tests & quality registers, DAR library, references); 3 · Bills, TDS / FDS & letters (RA / Final bill with all documents in Word / Excel, hindrance, EOT, TDS, extra items, WPR / MPR).","Pick the work in the project box at the top. Every tab shows that work only.","Search (box at the top, or Search & more → Search): checks every line of all reference documents on record (GCC, NITs, DSR / DAR, Specifications, Manual / SOP, IS codes, your bill / EOT / deviation formats, progress reports) and all records of the open work. Shows document, page and line; “Nil” when nothing matches. “Answer from these extracts” gives a short answer quoting only those extracts. References tab lists every document and opens it page by page; bill documents show “your format on record” links.","Data entered at site (daily register) flows into progress, the dashboard, RA bill quantities, the material statement, labour payments and contract letters.","Documents are filled automatically from Contract details + BOQ + measurements. Download them as Word, print-ready HTML or Excel.","Checks tab and Overview show what is missing, overdue or not as per specification."],tips:["Data is saved to your ledger as soon as you press Save. Anyone you share the page with as a viewer sees it read-only."]},
 {id:"setup",t:"2. First-time setup of a new work (30 minutes)",lead:"Do these once per work order, in this order.",
  steps:["All projects → + New project: name of work, W.O. no., contract value, start and completion date, work type (loads standard expense heads). Add budget per head if you have an estimate.",
   "RA / Final bill → Contract details: contractor (name, PAN, GSTIN, bank, EPF / ESIC, labour licence), client (CWC office, addressed to, site engineer, HoE, WHM), LOA / agreement no., PG, CAR / WC policy, GST and deduction %. Also: PMC (if any), site handover and stipulated start dates, work components / buildings (e.g. PEB Godown, Admin Building, Roads) and the WPR week start day. Filled once — used in every bill, letter and report.",
   "BOQ: import the work-order Excel or add items one by one — DSR 2023 item no., description, unit, rate, quantity. The DSR no. links the DAR 2023 analysis for the material statement.",
   "BOQ → each item: component / building, planned start and finish (makes the programme, S-curve and look-ahead). Mark extra / substitute items as EI / SI.",
   "Labour: add workers with category and daily wage.","Investors & funds (Site finance): record the capital / loan each partner brings in, and any capital returned, interest or profit share paid. Cash in hand on the dashboard = funds + money received from CWC − payments made; the investor statement shows each partner's share of the book margin.","Approved makes (Site work → Approved makes): check the material-wise list against the NIT of this work (Edit list), choose the make proposed for each material. Record the make of every lot in Daily site → Materials received; the make is ticked as brought at site. Any make outside the list needs the Engineer-in-Charge's written approval — draft the request letter and record the approval letter no., date and copy before use.",
   "Work file (opens after + New project): collect and upload the start-up documents — NIT, LOA, work order, agreement, BOQ, estimated measurement approved by the Engineer-in-Charge, drawings, PG, CAR and WC policies, EPF / ESIC / BOCW, labour licence, engineer details, programme, levels, mix design, DAR analysis. Each has a fixed due date from the LOA or start date; overdue and expiring items show on the Overview and the checklist goes with the bill set.",
   "Letters & EOT: prepare the programme letter (due within 7 working days of start, GCC cl. 5)."],tips:["If the BOQ item has no DAR analysis, add it in the DAR library — it then counts in the material statement."]},
 {id:"daily",t:"3. Daily routine at site (15 minutes every evening)",lead:"Daily site tab = the site register. One page per day.",
  steps:["Open Daily site → pick today's date.","0 · Day status (answer first): A. Any hindrance at site today? — No / Yes (pick the running hindrance from the register or + New hindrance; tick “removed today” when it ends). B. Was any work executed? — Yes / No (NIL day). A NIL day without hindrance needs a reason (Sunday, holiday, labour not available…). The register date of the hindrance extends itself every day you select it.","1 · Work executed: tick each BOQ item done today and record its measurement lines (location, Nos × L × B × H, or a direct qty). On saving, the quantity goes to BOQ executed qty, progress, WPR / MPR and the running account; the RA bill copies these lines date-wise into its MB and abstract.","Enter once, used everywhere: workers ticked present in Daily site are the attendance (muster roll, Form XVI, 19D); a material received at site with rate is also the purchase entry in the cash book (on credit until you mark it paid — add GST then); a test recorded from Daily site goes to the test register; Work file and Contract details share the same LOA, PG, policy, EPF / ESIC and licence fields.","Running account (bottom of Daily site): item-wise quantity and amount not yet billed. A reminder appears when the NIT interval (default 15 working days) or the minimum bill value / % set in Contract details is reached.","Labour: nos. by category / attendance; materials received (quantity in the purchase unit shown — cement in bags) and consumed.","Machinery log: one card per machine — owned / hired, operator, hour-meter (HMR) start and end (running hours work out themselves), idle / breakdown hours with reason, diesel, hire rate per hour or day and item of work. A hired machine is posted to the cash book as hire on credit; the log book goes into the RA bill, the WPR and cost analysis.","Quick entry: the chips at the top jump to each section and show what is filled; “⧉ Copy last day” brings yesterday's labour, attendance and machinery (meter start = yesterday's end) — change only what is different. Whatever you type is held as a draft until you press Save (bar at the bottom); 📷 Camera takes a photo straight into the day.","Tests and samples (cubes, slump, materials) — feeds the cube and sample registers.","Weather (write “Rain” on rain days — used for the EOT rain annexure), visitors, site instructions received.","The day status goes everywhere: hindrance register and EOT (Part I, bar chart, Annexure-I), WPR / MPR (working / NIL days), muster roll (N = NIL day), Clause 19D (working days), cement register (NIL rows) and the Day-wise site register in the bill set. Days not recorded are listed on the Daily site page; unrecorded Sundays can be closed as weekly off in one click.","Work done by location: one line per component (or leave blank — the app writes it from today's quantities). This becomes the WPR “work done” columns and MPR text.",
   "Photographs: + Add photos (phone camera or gallery). Give each a caption, component, type (Work / Hindrance) and keep “In report” ticked. They go into the WPR and MPR with Fig numbers.",
   "Finalise the day after checking. Finalised days are what the bill uses.","Expenses: enter every payment with head, payee, qty × rate, GST, mode, transaction ID and invoice."],tips:["Never leave a rain day or stoppage unrecorded — an EOT claim is only as good as the site register."]},
 {id:"specs",t:"3A. Specifications, tests and quantity control — item by item",lead:"Site work → Specs & QC. Every BOQ item is matched to its CPWD Specifications 2019 clause and its mandatory tests from the CWC Field Quality Plan (NIT App. T-XX).",
  steps:["Open Specs & QC and pick an item. Check the matched CPWD clause and work type. Change either one from the drop-downs if needed. For GSB, WMM and bituminous layers, enter the layer thickness in mm. If you use more than one quarry or plant, enter the number of sources.",
   "Before starting the item, read the work instruction (step by step) and the HOLD points. Get the Engineer-in-Charge's approval at each hold point, using the RFI checklist (Word).",
   "Mandatory tests: the app works out how many are required from the executed quantity, working days and months. Use “+ Record” against each test; results go to the test register. Shortfalls show in Checks.",
   "Quantity control: executed (daily site register) vs WO quantity vs billed. Quantity beyond WO needs a tentative deviation statement. Billed more than executed means the measurement must be checked.",
   "Mode of measurement is quoted from the CPWD clause. Record the MB in exactly that way, e.g. GSB / WMM depth to the nearest half cm from pits at 100 m spacing, and steel by length × standard weight.",
   "Word / Excel produces six documents: the BOQ-wise QA/QC plan, item-wise specification sheets, work instructions (method statements), RFI checklists, the quantity control statement, and test requirement vs conducted."],
  tips:["CWC FQP App. T-XX governs test frequency. Items it does not cover follow the CPWD Spec. 2019 list of mandatory tests. For concrete cubes, the higher of the FQP and IS 456 cl. 15.2.2 is required.","Open clause ↗ shows the full CPWD text at the right page."]},
 {id:"weekly",t:"4. Weekly and monthly routine",lead:"Keep time and money under control.",
  steps:["Weekly — Progress: look-ahead of items behind plan; Checks: clear red items; Cost analysis: labour payable as per site register; Materials: purchase as per the statement.",
   "Weekly — Letters & EOT → Weekly progress report (date-wise labour, T&P, work done by location, weather / hindrance, item summary and photographs). Raised automatically if the WPR week start day is set in Contract details.",
   "Monthly (by the 5th) — Letters & EOT → Monthly progress report for last month in CWC format: work details (i–xiv: client, PMC, agency, LOA, contract value, handover, stipulated / actual dates, EOT, physical & financial %, TDS status), component-wise progress with Fig refs, hindrance at site, assistance required from CWC, item-wise progress and photographs (GCC cl. 5; recovery ₹700 / week if late).",
   "Monthly — Labour: muster roll, wage register, 19D statement, PF / ESIC challans.",
   "Monthly — Receipts: record payments received against bills."]},
 {id:"bill",t:"5. Preparing an RA / Final bill",lead:"RA / Final bill tab.",
  steps:["+ New RA bill (or Final). Bill no. and dates fill automatically.","Fill from daily progress — takes finalised site quantities up to the measurement date.","Measurements → Details for each item: enter lines as Nos × L × B × H. Lines are checked live against CPWD Specs 2019.",
   "Red line = not as per specification, with the clause and a suggested correction. Apply suggestion → shows as proposed (original struck through). It counts in the bill only after the Engineer-in-Charge's name is entered and Verify is pressed. Or mark the line inadmissible (kept in MB, not paid).",
   "Documents: index, covering letter, GST invoice, abstract, MB, deviation, extra items, cement / steel statements, test reports, 19D, ESIC, check list, no-claim (final) and more — download all or one.",
   "Change the bill status as it moves: Draft → Submitted → Passed → Paid."],tips:["Submit the tentative deviation statement before the RA bill if any quantity exceeds the agreement (Letters & EOT reminds you)."]},
 {id:"letters",t:"6. Letters, EOT, deviation and extra items",lead:"Letters & EOT tab keeps every letter on record and tells you what is due and by when.",
  steps:["Obligations list is raised automatically from site data: hindrance → intimation; EI / SI executed or ordered → rate claim; quantity beyond agreement → tentative deviation statement; month end → MPR; completion date near with hindrance → EOT.",
   "Prepare letter → a filled draft opens (references, body, tables, annexures). Edit as needed and Save.",
   "Save & mark sent when it is dispatched. The letter is frozen on record exactly as sent (letter no., date).",
   "When the department replies, record reply date, letter no. and outcome. EOT granted → enter granted date; the completion date in the whole app updates. Extra item approved → enter approved rate; the BOQ item rate updates.",
   "If the reply period lapses (EOT 21 days, extra item 45 days) a reminder appears — prepare it in one click.",
   "+ New letter for any other correspondence. The register is your reference file for audit and arbitration.",
   "EOT case: in Progress → Hindrances give each hindrance its attribution (CWC cl. 5.3 / force majeure 5.2 / contractor 5.5), weightage and justification. Then: Application for EOT (letter + Part I + T-II register + rain record + revised programme); EOT technical noting (EIC) with assessment sheet, delay analysis and LD as per GCC cl. 2; Provisional EOT letter (cl. 5.4.1) with PG extension to EOT + 60 days.",
   "Deviation: mark each BOQ item Sch-I (DSR) or Sch-II (MR) and enter tender % per schedule in Contract details. TDS / FDS come out schedule-wise with cost index, extra item statement and cost index justification."],tips:["EOT application carries Part I (in the standard format), the T-II hindrance register, the bar chart, Annexure-I (hindrance and rain days from the site register) and Annexure-II (revised programme for balance work).","Running work: Progress → Hindrances & EOT → EOT pack gives Word / Excel / print in one click. A hindrance with no To date is treated as continuing and counted up to today.","Final bill: EOT Part I and the bar chart are in the bill document list (Part I shows NIL when the work is completed within time). Fill Time allowed and Reasons for earlier EOT in Contract details if needed."]},
 {id:"compl",t:"6A. Compliance and tests (Module 2)",lead:"Bills are held if NIT / GCC conditions are not met (GCC cl. 7A) — keep them green.",
  steps:["Compliance tab: PG 5% valid to completion + 60 days (cl. 1), CAR for full value within 30 days (cl. 36.4), WC / ESI (cl. 36.1), labour licence at 20+ workers, EPFO / ESIC / BOCW registration (cl. 7A), programme, technical staff, first-aid box (1 per 150), approved makes (App. T-XXI), mandatory tests (App. T-XX).","Enter PF / ESI challan no., date and amount for every month and tick “paid to bank” — attach with each bill (cl. 7.3.2, 7A(b)).","Tick the registers kept at site (Appendix T-I to T-XVIII and G-I to G-XV). Download the compliance statement, FQP sheet, Form XIII register of workmen, Form XIV employment cards and labour board (Word / Excel).","Daily site → Materials received: write the make / brand. A make outside the approved list shows in red.","Tests & registers: + Record test (cube, slump, silt, bulking, steel weighment, density, bricks, cement / steel MTC, water…). Results and acceptability are worked out (IS 456, IS 1786, CPWD Specs). Required vs conducted is calculated from executed quantity; registers download in Appendix T format. RA bill test statement takes these counts automatically."]},
 {id:"money",t:"7. Materials, cost and profit",lead:"Know what to buy and what you earn.",
  steps:["Materials: required quantity of each material = BOQ qty × DAR 2023 coefficient; compared with purchases from the cash book. Over-purchase above 10% is flagged.",
   "Cost analysis: executed value vs cost (material, labour, machinery, overheads) item-wise and per day; labour payable from attendance.",
   "Overview / Progress dashboard: physical %, time %, SPI, forecast completion, billed, received and profit % on executed work."]},
 {id:"data",t:"8. Data, sharing and safety",lead:"",
  steps:["Everything you save is stored in your ledger and opens on any device where you are signed in to Claude.","Share the page from Claude to give your team access. Viewers see it read-only; editors can enter data.","Download Excel of the cash book, site register and BOQ regularly as a backup.","Sent letters and verified measurements keep who / when — do not delete them; add a new entry instead."]}
];

 {t:"Lesson 1 — Set up a work",obj:"Create a project with contract details and BOQ.",do:["Press “Create practice project” below (or + New project).","Open RA / Final bill → Contract details and look at each section.","Open BOQ, open one item, add planned start and finish."],q:[["Where do you enter the contractor's GSTIN and bank details?","RA / Final bill → Contract details. Filled once, used in every document."],["Why enter the DSR 2023 item no. in the BOQ?","It links the DAR 2023 analysis, so materials required are calculated."]]},
 {t:"Lesson 2 — Write the daily site register",obj:"Record one day completely.",do:["Daily site → today's date.","Enter quantity for one item, labour, weather “Rain”, and a hindrance “Rain — work stopped”.","Add a photo, caption it and pick its component.","Save and Finalise."],q:[["What happens to the hindrance you typed?","It enters the hindrance register and a 14-day intimation appears in Letters & EOT."],["Why write “Rain” in weather?","Rain days are counted for the EOT rain annexure."]]},
 {t:"Lesson 3 — Cash book",obj:"Record a payment properly.",do:["Expenses → + Expense: head, payee, qty × rate, GST, mode, transaction ID, invoice.","Open Checks — see what is flagged."],q:[["Which entries get flagged?","No invoice, no transaction ID for online payments, duplicates, over budget."]]},
 {t:"Lesson 4 — RA bill with measurement checks",obj:"Make a bill and correct a measurement.",do:["RA / Final bill → + New RA bill → Fill from daily progress.","Details on a plaster item: enter a deduction line Nos −2, L 1.0, H 1.2 (opening 1.2 sqm).","See the red flag (deduct one face only), Apply suggestion, enter EIC name, Verify.","Open Documents and preview the MB and abstract."],q:[["When does a corrected value count in the bill?","Only after the Engineer-in-Charge verifies it (name and date recorded)."],["Opening of 0.4 sqm in plaster — deduct?","No. Up to 0.5 sqm no deduction (Specs 2019 cl. 13.1.9.9)."]]},

const FAQ=[["A document shows blanks “____”.","Fill the missing field in Contract details or the bill — documents fill from there."],["Material statement shows 0 cost.","Enter purchases in the cash book with quantity and rate under the material head."],["A BOQ item is missing from the material statement.","Its DSR no. has no DAR analysis — add it in the DAR library."],["Bill quantity differs from site register.","Bills take only finalised days up to the measurement date. Finalise the days, then Fill from daily progress again."],["I entered a wrong letter as sent.","Change status or delete it, then prepare it again — the register keeps the new one."],["Someone else can't edit.","They opened it as a viewer. Share the page with edit access."]];

function guideTicks(){ const c=CT(), P=!!proj();
  return [["Project created",S.projects.length>0,"portfolio"],["Contract details filled",P&&!!c.cName&&!!(c.loaNo||c.woDate||proj().workOrderNo),"rabill"],["BOQ entered",P&&S.boq.length>0,"boq"],["Plan dates on BOQ items",P&&S.boq.some(b=>b.planStart),"boq"],["Workers added",P&&(S.workers||[]).length>0,"labour"],["First day in site register",P&&(S.progress||[]).length>0,"site"],["First expense recorded",P&&S.expenses.length>0,"expenses"],["First RA bill made",P&&S.bills.some(b=>b.kind),"rabill"],["First letter on record",P&&(S.letters||[]).length>0,"letters"]]; }
function guideBlocks(){ const B=[H("CONTRACTOR SITE LEDGER — USER MANUAL & TRAINING",{center:true}),P_("Finance · Site · Bill · Letters for civil and electrical works (CWC — Model GCC Dec-2025, CPWD DSR / DAR 2023, Specs 2019, Works Manual 2026).",{align:"center"})];
  GUIDE.forEach(g=>{ B.push(H(g.t)); if(g.lead) B.push(P_(g.lead)); B.push(P_(g.steps.map((s,i)=>`${i+1}. ${s}`).join("\n"))); (g.tips||[]).forEach(t=>B.push(P_("Tip: "+t,{small:true}))); });
  B.push(H("9. Time limits — contract letters"),TB([["Letter / action","Time limit","Clause"]],TIMELIMITS));
  B.push(H("10. Training lessons")); LESSONS.forEach(l=>{ B.push(P_(l.t+" — "+l.obj,{bold:true}),P_(l.do.map((s,i)=>`${i+1}. ${s}`).join("\n")),P_(l.q.map(([q,a])=>`Q: ${q}\nA: ${a}`).join("\n"),{small:true})); });
  B.push(H("11. Common questions"),TB([["Problem","What to do"]],FAQ),H("12. Glossary"),TB([["Term","Meaning"]],GLOSS)); return [{title:"User manual",blocks:B}]; }
function vGuide(v){
  const T=guideTicks(), done=T.filter(t=>t[1]).length;
  v.innerHTML=`<div class="vhead"><div><div class="lbl">Read any time · new users start here</div><h2>Guide & training</h2></div><div class="acts"><button class="btn" type="button" data-g="html">Print manual</button><button class="btn pri" type="button" data-g="docx">Download manual (Word)</button></div></div>
  <div class="panel"><div class="group-h"><h3>Getting started — ${done} of ${T.length} done${S.pid?` for “${esc(proj()?.name||"")}”`:""}</h3>${S.canWrite&&S.db?`<button class="btn sm" type="button" data-g="practice">Create practice project</button>`:""}</div>
   <p class="muted" style="margin:0 0 8px;font-size:13px">Ticks itself as you work. The practice project has sample BOQ, site days and a hindrance so a new user can try every tab safely, then delete it (All projects → open → Delete project).</p>
   <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px">${T.map(([l,ok,tab])=>`<a href="#${tab}" style="display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:inherit"><span class="pill ${ok?"ok":"info"}" style="min-width:22px;text-align:center">${ok?"✓":"·"}</span>${esc(l)}</a>`).join("")}</div></div>
  <div class="panel" style="padding:10px 14px"><b style="font-size:13px">Contents:</b> ${GUIDE.map(g=>`<a href="#guide" data-jump="${g.id}" style="margin-right:10px;font-size:13px">${esc(g.t)}</a>`).join("")}<a href="#guide" data-jump="time" style="margin-right:10px;font-size:13px">9. Time limits</a><a href="#guide" data-jump="train" style="margin-right:10px;font-size:13px">10. Training lessons</a><a href="#guide" data-jump="faq" style="font-size:13px">11–12. FAQ & glossary</a></div>
  ${GUIDE.map(g=>`<div class="panel" id="gd_${g.id}"><h3 style="margin-bottom:6px">${esc(g.t)}</h3>${g.lead?`<p class="muted" style="margin:0 0 8px">${esc(g.lead)}</p>`:""}<ol style="margin:0;padding-left:20px;line-height:1.6">${g.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${(g.tips||[]).map(t=>`<div class="calc" style="margin-top:8px">Tip: ${esc(t)}</div>`).join("")}</div>`).join("")}
  <div class="panel" id="gd_time"><h3 style="margin-bottom:6px">9. Time limits — contract letters (Model GCC Dec-2025)</h3><div class="tbl-wrap"><table class="led"><thead><tr><th>Letter / action</th><th>Time limit</th><th>Clause</th></tr></thead><tbody>${TIMELIMITS.map(r=>`<tr style="cursor:default"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="nowrap">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel" id="gd_train"><h3 style="margin-bottom:6px">10. Training lessons</h3><p class="muted" style="margin:0 0 8px;font-size:13px">About 10 minutes each. Use the practice project. Open each question to check your answer.</p>
   ${LESSONS.map(l=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(l.t)}</b> <span class="muted">— ${esc(l.obj)}</span><ol style="margin:6px 0;padding-left:20px;line-height:1.6">${l.do.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${l.q.map(([q,a])=>`<details style="margin:4px 0;font-size:13px"><summary style="cursor:pointer">${esc(q)}</summary><div class="calc" style="margin-top:4px">${esc(a)}</div></details>`).join("")}</div>`).join("")}</div>
  <div class="panel" id="gd_faq"><h3 style="margin-bottom:6px">11. Common questions</h3>${FAQ.map(([q,a])=>`<details style="margin:4px 0"><summary style="cursor:pointer">${esc(q)}</summary><div class="calc" style="margin-top:4px">${esc(a)}</div></details>`).join("")}
   <h3 style="margin:14px 0 6px">12. Glossary</h3><div class="tbl-wrap"><table class="led"><tbody>${GLOSS.map(r=>`<tr style="cursor:default"><td class="nowrap"><b style="font-weight:600">${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></div>`;
  v.onclick=async ev=>{ const j=ev.target.closest("[data-jump]"); if(j){ ev.preventDefault(); document.getElementById("gd_"+j.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
    const a=ev.target.closest("[data-g]")?.dataset.g; if(!a) return;
    if(a==="practice") return makePractice();
    if(!S.downloads){ toast("Downloads aren't available in this view — use your browser's print."); return; }
    try{ if(a==="docx") await S.downloads.save({filename:"Site Ledger - user manual.docx",data:await packDocx(guideBlocks())}); else await S.downloads.save({filename:"Site Ledger - user manual.html",data:packHTML(guideBlocks())}); toast("Manual saved"); }catch(e){ if(!(e&&e.code==="declined")) toast("Couldn't prepare the file."); } };
}
async function makePractice(){

    if(cr){ const k="cement__qtl", R={key:k,name:"Cement",unit:"qtl"}, c=convOf(p,{key:matKey({name:"Cement",unit:"qtl"}),name:"Cement",unit:"qtl"}); lines.push({key:matKey({name:"Cement",unit:"qtl"}),name:"Cement",unit:"qtl",coef:cr,th:cr*q,pu:c.pu,f:c.f}); }

      Object.values(agg).forEach(A=>{ const c=convOf(p,A); lines.push({...A,th:A.coef*q,pu:c.pu,f:c.f}); }); }
    if(!lines.length){ none.push(b); return; }

      const T=tot[l.key]||(tot[l.key]={key:l.key,name:l.name,pu:l.pu,thP:0,iss:0,items:0,agg:l.agg}); T.thP+=l.thP; T.iss+=l.iss; T.items++; });
    let grp=null; const AG=lines.filter(l=>l.agg); if(AG.length>1){ const th=AG.reduce((a,l)=>a+l.thP,0), is=AG.reduce((a,l)=>a+l.iss,0); grp={name:"Aggregates & sand — all sizes (blended issue)",pu:AG[0].pu,thP:th,iss:is,var:is?is-th:null,pc:is&&th?(is/th-1)*100:null}; if(is) AG.forEach(l=>{ l.inGrp=true; l.var=null; l.pc=null; }); }

/* ---------- Cost analysis ---------- */
function costing(){
  const p=proj()||{}, B=S.boq, ex=execMap().m, P=S.progress||[], st=statement(), L=libIndex();
  const avg={}; st.rows.forEach(r=>{ if(r.avg) avg[r.key]=r.avg; }); const rq={}; P.forEach(d=>(d.recv||[]).forEach(x=>{ if(num(x.rate)){ const a=rq[x.m]||(rq[x.m]={q:0,a:0}); a.q+=num(x.qty); a.a+=num(x.qty)*num(x.rate); } }));
  const rateOf=k=>avg[k]||(rq[k]&&rq[k].q?rq[k].a/rq[k].q:0);
  const I={}; B.forEach(b=>{ const e=num(ex[b.id]); I[b.id]={b,act:actOf(b),ex:e,val:e*num(b.rate),lab:0,mat:0,mach:0,matTh:false,billed:kindBills().reduce((s,x)=>s+num((x.qty||{})[b.id]),0)}; });
  let un={lab:0,mat:0,mach:0}, issued=new Set(), md=0;
  P.forEach(d=>{ const dv=Object.entries(d.qty||{}).map(([k,q])=>[k,num(q)*num(I[k]?.b.rate)]).filter(x=>I[x[0]]), tv=dv.reduce((s,x)=>s+x[1],0);
    const put=(boq,c,f)=>{ if(boq&&I[boq]) I[boq][f]+=c; else if(tv) dv.forEach(([k,v])=>I[k][f]+=c*v/tv); else un[f]+=c; };
    (d.lab||[]).forEach(l=>{ md+=num(l.nos); put(l.boq,num(l.nos)*num(l.rate),"lab"); });
    (d.iss||[]).forEach(x=>{ if(x.boq) issued.add(x.boq); put(x.boq,num(x.qty)*rateOf(x.m),"mat"); });
    (d.mach||[]).forEach(x=>put(x.boq,machCost(x),"mach")); });
  Object.values(I).forEach(i=>{ if(issued.has(i.b.id)||!i.ex) return; const li=L[normNo(i.b.dsrNo)]; if(!li) return; const uf=unitFactor(i.b.unit,li.unit);
    expandMats(li,L).forEach(m=>{ const k=matKey(m), c=convOf(p,{key:k,name:m.name,unit:m.unit}); i.mat+=m.qty*uf*i.ex*c.f*rateOf(k); }); i.matTh=true; });
  const items=Object.values(I), acts={}; items.forEach(i=>{ const A=acts[i.act]||(acts[i.act]={act:i.act,n:0,val:0,lab:0,mat:0,mach:0}); A.n++; A.val+=i.val; A.lab+=i.lab; A.mat+=i.mat; A.mach+=i.mach; });
  const T=items.reduce((s,i)=>({val:s.val+i.val,lab:s.lab+i.lab,mat:s.mat+i.mat,mach:s.mach+i.mach,unb:s.unb+Math.max(0,i.ex-i.billed)*num(i.b.rate)}),{val:0,lab:0,mat:0,mach:0,unb:0});
  return {items,acts:Object.values(acts).sort((a,b)=>b.val-a.val),T,un,md,open:P.filter(d=>!d.final&&Object.keys(d.qty||{}).length).length};
}

function md(t){
  const lines=esc(t).split("\n"); let h="", inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  for(const ln of lines){ const m=ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){ if(!inList){h+="<ul>";inList=true;} h+=`<li>${inl(m[1])}</li>`; continue; }
    if(inList){h+="</ul>";inList=false;}
    if(ln.trim()) h+=`<p>${inl(ln.replace(/^#+\s*/,""))}</p>`; }
  if(inList) h+="</ul>"; return h;
}

    X.utils.book_append_sheet(wb,ws2,"Head-wise Summary");

async function onFile(ev){
  const file=ev.target.files[0]; ev.target.value=""; if(!file) return;
  if(S.fileMode==="boq"){ try{ await importBoqFile(file); }catch{ toast("Couldn't read that file. Save it as .xlsx and try again."); } return; }
  if(S.fileMode==="lib"){ try{ await importLibFile(file); }catch{ toast("Couldn't read that file. Save it as .xlsx and try again."); } return; }
  try{
    const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{cellDates:true});
    const sn=wb.SheetNames.find(n=>/expen|statement|cash/i.test(n))||wb.SheetNames[0], ws=wb.Sheets[sn];
    const aoa=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const hi=aoa.findIndex(r=>r&&r.some(c=>/^date$/i.test(String(c||"").trim()))&&r.some(c=>/amount/i.test(String(c||""))));
    if(hi<0){ toast("Couldn't find a header row with Date and Amount."); return; }
    const H=aoa[hi].map(c=>String(c||"").trim().toLowerCase());
    const col=(...keys)=>H.findIndex(h=>keys.some(k=>h===k||h.includes(k)));
    const ix={date:col("date"),cat:col("expense type","head","category"),desc:col("description","particular"),payee:col("payment made to","payee","paid to","party"),mode:col("mode"),qty:col("qty","quantity"),rate:col("rate"),gst:col("gst"),tr:col("transport"),amt:col("amount"),rem:col("remarks"),txn:col("transaction id","utr","txn"),link:col("invoice / transaction link","invoice link","link","invoice"),status:col("status")};
    const range=X.utils.decode_range(ws["!ref"]); const rows=[];
    for(let r=hi+1;r<aoa.length;r++){ const R=aoa[r]||[]; const g=i=>i>=0?R[i]:null;
      const amt=num(g(ix.amt)), date=parseDate(g(ix.date)); if(!amt||!date) continue;
      let url=""; if(ix.link>=0){ const cell=ws[X.utils.encode_cell({r:r+range.s.r,c:ix.link+range.s.c})]; url=(cell&&cell.l&&cell.l.Target)||""; if(!url&&/^https?:/i.test(String(g(ix.link)||""))) url=String(g(ix.link)); }
      const lt=String(g(ix.link)||"").toLowerCase(), rem=String(g(ix.rem)||""), mode0=String(g(ix.mode)||"").toLowerCase();
      const mode=/gpay|upi|phonepe|paytm/i.test(rem+mode0)?"GPay/UPI":/off/.test(mode0)?"Offline":/cash/.test(mode0)?"Cash":/neft|imps|rtgs|bank/.test(mode0)?"Bank transfer":"Online";
      const txn=String(g(ix.txn)??"").trim();
      rows.push({date,category:normCat(g(ix.cat),cats()),desc:String(g(ix.desc)??"").trim(),payee:String(g(ix.payee)??"").trim(),mode,qty:num(g(ix.qty)),rate:num(g(ix.rate)),gst:num(g(ix.gst)),transport:num(g(ix.tr)),amount:amt,
        status:/credit/i.test(String(g(ix.status)||"")+rem)?"On credit":"Paid",txnId:/^\d+\.0$/.test(txn)?txn.slice(0,-2):txn==="-"?"":txn,invoice:url?"Attached":/pending/.test(lt)?"Pending":"Missing",invoiceUrl:/^https?:\/\//i.test(url)?url:"",remarks:/^paid( gpay)?$/i.test(rem.trim())?"":rem.trim()});
    }
    if(!rows.length){ toast("No dated rows with an amount were found in that sheet."); return; }
    S.importRows={file:file.name,sheet:sn,rows}; location.hash="expenses"; render();
  }catch(e){ toast("Couldn't read that file. Save it as .xlsx and try again."); }
}
function importPanel(){ const I=S.importRows, t=I.rows.reduce((s,r)=>s+r.amount,0);
  return `<div class="panel" style="border-color:var(--carbon)"><div class="vhead"><div><div class="lbl">Import from ${esc(I.file)} · sheet “${esc(I.sheet)}”</div><h3>${I.rows.length} entries totalling ${inr(t)}</h3><p class="muted" style="margin:4px 0 0;font-size:13px">${fmtD(I.rows.reduce((a,r)=>r.date<a?r.date:a,"9999"))} to ${fmtD(I.rows.reduce((a,r)=>r.date>a?r.date:a,""))} · heads: ${esc([...new Set(I.rows.map(r=>r.category))].join(", "))}${(()=>{ const n=[...new Set(I.rows.map(r=>r.category))].filter(c=>!cats().includes(c)); return n.length?` · <b>new heads will be added:</b> ${esc(n.join(", "))}`:""; })()}</p></div>
  <div class="acts"><button class="btn" type="button" data-act="cancelimport">Cancel</button><button class="btn pri" type="button" data-act="doimport" id="impBtn">Add to ${esc(proj().name)}</button></div></div></div>`; }
async function doImport(){
  const I=S.importRows; if(!I) return; const b=$("#impBtn"); b.disabled=true;
  const base=Date.now(); let done=0;
  try{
    const newCats=[...new Set(I.rows.map(r=>r.category))].filter(c=>!cats().includes(c));
    if(newCats.length){ const p=proj(); const H=[...heads(),...newCats.map(n=>({name:n,group:HEAD_GROUP[n.toLowerCase()]||"Other"}))]; const d={...p,heads:H,categories:H.map(h=>h.name)}; delete d.id; await S.db.doc(`projects/${p.id}`).set(d); }
    for(let i=0;i<I.rows.length;i+=6){ await Promise.all(I.rows.slice(i,i+6).map((r,j)=>S.db.collection(`projects/${S.pid}/expenses`).doc().set({...r,seq:base+i+j,createdAt:new Date().toISOString()}))); done=Math.min(I.rows.length,i+6); b.textContent=`Adding ${done}/${I.rows.length}…`; }
    S.importRows=null; toast(`${done} entries imported`); render();
  }catch(e){ b.disabled=false; b.textContent="Retry import"; toast(`${done} added before an error. `+saveErr(e)); }
}

  const t=ev.target; if(t.closest("[data-stop]")) return;
  if(t.closest("dialog")) return;
  const el=t.closest("[data-act],[data-edit],[data-editbill],[data-cat],[data-ids],[data-payee],[data-sort],[data-ask],[data-draft],[data-draftx],[data-proj],[data-editboq],[data-addlib],[data-editlib],[data-mat],[data-conv],[data-buy],[data-go]"); if(!el) return;

    addboq:()=>openBoqForm(null),boqrefs:async()=>{ const L=S.boq.filter(b=>!(b.refs||[]).length); let n=0, k=0; for(const b of L){ k++; toast(`Attaching specification & manual — item ${k} of ${L.length}…`); try{ n+=await attachRefs(b); }catch{} } toast(`${L.length} item${L.length>1?"s":""}: ${n} references attached (DSR, DAR, CPWD Spec, Works Manual)`); },pasteboq:()=>openExtract("boq"),addlib:()=>openLibForm(null),extractlib:()=>openExtract("lib"),exportstmt:()=>doExportStatement("xlsx"),exportstmtdoc:()=>doExportStatement("docx"),matboqdoc:()=>doMatBoq("docx"),matboqxls:()=>doMatBoq("xlsx"),togglebuy:()=>{S.matOnlyBuy=!S.matOnlyBuy;render();},
    cancelboqimport:()=>{S.boqImport=null;render();},doboqimport:doBoqImport,
    clearf:()=>{S.f={q:"",cat:"",payee:"",month:"",status:"",inv:""};render();},clearchat:()=>{S.chat=[];render();},stop:()=>S.ctl?.abort(),doimport:doImport,cancelimport:()=>{S.importRows=null;render();},refreshport:()=>{S.port.data=null;loadPortfolio();}})[D.act]?.(); return; }
  if(D.go){ location.hash=D.go; return; }
  if(D.editboq){ const b=S.boq.find(x=>x.id===D.editboq); if(b) openBoqForm(b); return; }
  if(D.addlib){ const b=S.boq.find(x=>x.id===D.addlib); openLibForm(null,b?{dsrNo:b.dsrNo,desc:b.desc,unit:b.unit}:null); return; }
  if(D.editlib){ const li=D.editlib.startsWith("base:")?(S.libBase||[]).find(x=>"base:"+x.dsrNo===D.editlib):S.lib.find(x=>x.id===D.editlib); if(li) openLibForm(li); return; }
  if(D.conv){ openConvForm(D.conv); return; }
  if(D.buy){ const m=statement().rows.find(x=>x.key===D.buy); if(m) openExpenseForm({date:todayISO(),category:guessHead(m.name),desc:m.name,material:m.key,mode:"GPay/UPI",status:"Paid",invoice:"Pending"}); return; }
  if(D.mat){ S.matOpen=S.matOpen===D.mat?null:D.mat; render(); return; }
  if(D.proj){ if(D.proj!==S.pid) selectProject(D.proj); location.hash="overview"; return; }
  if(D.edit){ const e=S.expenses.find(x=>x.id===D.edit); if(e) openExpenseForm(e); return; }
  if(D.editbill){ const b=S.bills.find(x=>x.id===D.editbill); if(b) openBillForm(b); return; }
  if(D.sort){ S.sort = S.sort.k===D.sort?{k:D.sort,d:-S.sort.d}:{k:D.sort,d:D.sort==="date"||D.sort==="amount"?-1:1}; render(); return; }
  if(D.cat!=null&&D.cat!==""){ S.f={q:"",cat:D.cat,payee:"",month:"",status:"",inv:""}; location.hash="expenses"; render(); return; }
  if(D.ids){ S.f={q:"",cat:"",payee:"",month:"",status:"",inv:"",ids:D.ids.split(",")}; location.hash="expenses"; render(); return; }
  if(D.payee){ S.f={q:"",cat:"",payee:D.payee==="(no payee)"?"":D.payee,month:"",status:"",inv:""}; location.hash="expenses"; render(); return; }
  if(D.ask){ ask(D.ask); return; }
  if(D.draft!=null){ const i=+D.draft; openExpenseForm(S.drafts[i],true,i); return; }
  if(D.draftx!=null){ S.drafts.splice(+D.draftx,1); render(); return; }
});

  if(!S.db) return; S.pid=id; store.set("ledger.pid",id); S.expenses=[]; S.bills=[]; S.boq=[]; S.boqImport=null; S.matOpen=null; S.loadedExp=false; S.drafts=[]; S.chat=[]; S.importRows=null; S.f={q:"",cat:"",payee:"",month:"",status:"",inv:""};
  unsubExp?.(); unsubBills?.(); unsubBoq?.(); unsubProg?.(); unsubWk?.(); unsubAtt?.(); unsubMeas?.(); unsubLt?.(); unsubTs?.(); S.tests=[]; S.rb={sel:null,sub:"meas"}; S.meas={}; S.progress=[]; S.workers=[]; S.att=[]; S.letters=[];
  unsubFd?.(); S.funds=[]; unsubFd=S.db.collection(`projects/${id}/funds`).onSnapshot(s=>{ S.funds=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{});

  unsubBoq=S.db.collection(`projects/${id}/boq`).onSnapshot(s=>{ S.boq=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{});
  unsubExp=S.db.collection(`projects/${id}/expenses`).onSnapshot(s=>{ S.expenses=s.docs.map(d=>{ const x={id:d.id,...d.data()}; if(x.material) x.material=canonKey(x.material); return x; }); S.loadedExp=true; render(); },e=>{ toast("Expense entries stopped updating. Reload to reconnect."); });
  unsubBills=S.db.collection(`projects/${id}/bills`).onSnapshot(s=>{ S.bills=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{});
  render();

async function boot(){
  fetch("dar2023.json").then(r=>r.ok?r.json():[]).then(a=>{ S.libBase=(a||[]).map(i=>({...i,base:true,verified:true,source:"CPWD DAR 2023 (bundled)"})); libCache=null; render(); }).catch(()=>{});
  try{ const st=document.createElement("style"); st.textContent=DOC_CSS; document.head.appendChild(st); }catch{}
  render(); refIndex().then(()=>render());
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,sample,downloads,assets]=await Promise.all(["db","user","sample","downloads","assets"].map(use));
  Object.assign(S,{db,user,sample,downloads:downloads&&{save:o=>downloads.save({...o,filename:cleanFn(o.filename)})},assets,ready:true});
  if(user){ try{ const c=await user.can("data.write"); if(c===false) S.canWrite=false; }catch{} }
  if(sample){ try{ const L=await sample.limits(); S.tools=!!L.tools; S.imgOk=!!L.images; }catch{} }
  if(!db){ render(); return; }
  db.collection("library/dar2023/items").onSnapshot(s=>{ S.lib=s.docs.map(d=>({id:d.id,...d.data()})); libCache=null; render(); },()=>{});
  const timer=setTimeout(()=>{ S.offline=true; render(); },10000);
  db.collection("projects").onSnapshot(s=>{
    if(!s.metadata.fromCache){ clearTimeout(timer); S.offline=false; }
    S.projects=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
    S.loadedProjects=true;
    if(S.port.data && S.port.data.map(x=>x.id).sort().join()!==S.projects.map(x=>x.id).sort().join()) S.port.data=null;
    if(!S.projects.some(p=>p.id===S.pid)){ const saved=store.get("ledger.pid"); const pick=S.projects.find(p=>p.id===saved)||S.projects[0]; if(pick) selectProject(pick.id); else { S.pid=null; render(); } }
    else render();
  },e=>{ clearTimeout(timer); S.offline=true; S.loadedProjects=true; render(); });
}
boot();
